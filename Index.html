<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Unblocked Games Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        h1 { color: #00ffcc; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 40px auto;
        }
        .card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }
        .card:hover {
            border-color: #00ffcc;
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

    <h1>🎮 Unblocked Static Arcade</h1>
    <p>Fast, lightweight, and hosted on GitHub.</p>

    <div class="grid">
        <!-- We will link your games here -->
        <a href="game-slope.html" class="card">
            <h3>Slope</h3>
            <p>3D Endless Runner</p>
        </a>
        <a href="game-retro.html" class="card">
            <h3>Retro Emulator</h3>
            <p>Play NES/GBA games</p>
        </a>
    </div>

</body>
</html>
